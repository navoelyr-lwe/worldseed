name: Release package (temporary)

# TEMPORARY packaging path for v0.18.0-preview. The canonical release.yml runs
# its verify/publish jobs on GitHub-hosted runners, which are unavailable for
# this private repository (see docs/CI-VE-DAL-KORUMASI.md). This workflow builds
# and packages the SAME artifact with the SAME tools/package-windows.ps1 on the
# isolated, secretless self-hosted Windows runner, then uploads it so the release
# can be published by the release authority. Removed once the hosted pool returns.
on:
  push:
    branches: [release-pkg-v0.18]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: windows x64 package (self-hosted)
    runs-on: [self-hosted, windows, x64, worldseed-gui]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure (MSVC x64)
        shell: pwsh
        run: cmake -S . -B build-rel -A x64 -DCMAKE_BUILD_TYPE=Release -DWS_WARNINGS_AS_ERRORS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build-rel --config Release

      - name: Test
        shell: pwsh
        run: ctest --test-dir build-rel -C Release --output-on-failure

      - name: Package (portable folder + zip)
        shell: pwsh
        run: ./tools/package-windows.ps1 -BuildDir build-rel -Version "v0.18.0-preview"

      - name: Verify package
        shell: pwsh
        run: |
          if (-not (Test-Path worldseed-windows-x64.zip)) { Write-Error "no zip"; exit 1 }
          if (-not (Test-Path worldseed-windows-x64.zip.sha256)) { Write-Error "no sha"; exit 1 }
          if (-not (Test-Path MANIFEST.txt)) { Write-Error "no manifest"; exit 1 }
          if (-not (Select-String -Path evidence/live/tour-a/manifest.txt -Pattern "menu_click_verified=1" -Quiet)) { Write-Error "menu_click not verified"; exit 1 }
          Write-Output "PKG_ZIP_BYTES=$((Get-Item worldseed-windows-x64.zip).Length)"
          Get-Content worldseed-windows-x64.zip.sha256
          Write-Output "PKG_TEST_OK"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: worldseed-windows-x64
          path: |
            worldseed-windows-x64.zip
            worldseed-windows-x64.zip.sha256
            MANIFEST.txt
            evidence/preview/*.png
            evidence/preview/selftest.txt
            evidence/preview/perf.txt
            evidence/live/tour-a/*.png
            evidence/live/tour-a/manifest.txt
            evidence/live/tour-a/tour-manifest.txt
            evidence/live/headless.txt
            evidence/live/tour-a.txt
            evidence/live/select/*.png
            evidence/live/select/select-manifest.txt
            evidence/live/select.txt
