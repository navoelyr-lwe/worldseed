name: Release

# Release flow. Publishing authority is delegated to OpenHands by the project
# owner (see docs/adr/ADR-007-yetki-devri-ve-release.md): when all mandatory
# gates pass, a release is published without asking again.
#
# A release is created only for a version tag on main after CI has passed.
# Documentation/infrastructure-only changes are not product releases.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v0.1.0-preview)"
        required: true

permissions:
  contents: write

jobs:
  verify:
    name: verify gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Plan integrity gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, sys
          parts = sorted(Path("docs/plan-bundle").glob("part-*.txt"))
          payload = base64.b64decode("".join(p.read_text(encoding="ascii").strip() for p in parts), validate=True)
          expected = "69c49e5d7868fe1d83c2559f5da703a95eb443d18e4a5bd8b29eaa6c5a8f2f5a"
          if hashlib.sha256(payload).hexdigest() != expected:
              sys.exit("plan bundle digest mismatch")
          print("plan integrity ok")
          PY

  build-windows:
    name: windows x64 package
    runs-on: windows-2022
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package (portable folder + zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence/preview | Out-Null
          $exe = "build/src/app/Release/worldseed.exe"
          $scenes = "orbit","lowlight","spheres","materials","textured","sky","terrain_day","terrain_dusk","terrain_weather","terrain_physics","creature_walk","organism_forage","ecosystem","world_stream","director_shot","soundscape"
          for ($i = 0; $i -lt $scenes.Count; $i++) {
            $s = $scenes[$i]
            & $exe --capture "evidence/preview/$s.ppm" --scene $i --size 1280x720
            & tools/ppm2png.ps1 -In "evidence/preview/$s.ppm" -Out "evidence/preview/$s.png"
          }
          & $exe --selftest --size 640x360 | Tee-Object -FilePath evidence/preview/selftest.txt

          # P11 interactive application: drive the real live loop headless and a
          # deterministic tour (view switches, selection, save/load, stats panel),
          # then prove two tours agree frame-for-frame (the observer is read-only).
          New-Item -ItemType Directory -Force -Path evidence/live/tour-a,evidence/live/tour-b | Out-Null
          & $exe --live-headless 3 --size 1280x720 | Tee-Object -FilePath evidence/live/headless.txt
          if (-not (Select-String -Path evidence/live/headless.txt -Pattern "LIVE_HEADLESS_OK" -Quiet)) { exit 1 }
          & $exe --live-tour evidence/live/tour-a --size 1280x720 | Tee-Object -FilePath evidence/live/tour-a.txt
          if (-not (Select-String -Path evidence/live/tour-a.txt -Pattern "LIVE_TOUR_OK" -Quiet)) { exit 1 }
          if (-not (Select-String -Path evidence/live/tour-a.txt -Pattern "save_load_roundtrip=1" -Quiet)) { exit 1 }
          & $exe --live-tour evidence/live/tour-b --size 1280x720 | Out-Null
          Get-ChildItem evidence/live/tour-a/step-*.ppm | ForEach-Object {
            $b = Join-Path "evidence/live/tour-b" $_.Name
            if ((Get-FileHash $_.FullName).Hash -ne (Get-FileHash $b).Hash) {
              Write-Error "live tour $($_.Name) not reproducible"; exit 1
            }
            & tools/ppm2png.ps1 -In $_.FullName -Out ($_.FullName -replace '\.ppm$', '.png')
          }

          # P9 soundscape: our own C17 synthesis, rendered from a real ecology
          # run, so the preview ships a listenable WAV next to the frames.
          & build/tools/Release/ws_audio.exe "evidence/preview/soundscape.wav" 20260101 |
            Tee-Object -FilePath evidence/preview/audio.txt

          # P10 performance evidence: hardware profile, CPU/GPU raster timing and
          # reference-scene frame times. Runs on the CPU path here (no OpenCL
          # device on the runner) and reports gpu=unavailable.
          & build/tools/Release/ws_perf.exe --quick |
            Tee-Object -FilePath evidence/preview/perf.txt

          $stage = "stage/worldseed"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe "$stage/worldseed.exe"
          New-Item -ItemType Directory -Force -Path "$stage/preview" | Out-Null
          Copy-Item evidence/preview/*.png "$stage/preview/"
          Copy-Item evidence/preview/soundscape.wav "$stage/preview/"
          Copy-Item evidence/preview/perf.txt "$stage/preview/"
          New-Item -ItemType Directory -Force -Path "$stage/live" | Out-Null
          Copy-Item evidence/live/tour-a/*.png "$stage/live/"
          Copy-Item evidence/live/tour-a/manifest.txt "$stage/live/"
          @(
            "Worldseed Engine preview (P11 - urunlestirme ve ilk release).",
            "Canli uygulama: worldseed.exe --live  (tam ekran: --fullscreen)",
            "Canli kanit (penceresiz): worldseed.exe --live-headless 3 --size 1280x720",
            "Sahneler: worldseed.exe --list",
            "Kanit: preview/*.png (CPU referans renderer ciktilari), live/*.png (canli uygulama turu),",
            "preview/perf.txt (donanim/olcum) ve manifest.txt (SHA-256) ile CI artefaktlari.",
            "GPU yalniz gercek kazanc oldugunda kullanilir; OpenCL cihazi yoksa CPU fallback calisir."
          ) | Set-Content -Path "$stage/README.txt"

          # Evidence manifest: every shipped artefact with its size and SHA-256,
          # generated by our own C17 tool (docs/12, docs/18).
          $mfFiles = @("$stage/worldseed.exe")
          $mfFiles += Get-ChildItem "$stage/preview/*.png" | ForEach-Object { $_.FullName }
          $mfFiles += Get-ChildItem "$stage/live/*.png" | ForEach-Object { $_.FullName }
          $mfFiles += "$stage/preview/soundscape.wav"
          $mfFiles += "$stage/preview/perf.txt"
          & build/tools/Release/ws_manifest.exe --out "MANIFEST.txt" --version "${{ github.ref_name }}" @mfFiles
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item "MANIFEST.txt" "$stage/MANIFEST.txt"

          Compress-Archive -Path "$stage/*" -DestinationPath "worldseed-windows-x64.zip" -Force
          Get-FileHash worldseed-windows-x64.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  worldseed-windows-x64.zip" } |
            Set-Content -Path worldseed-windows-x64.zip.sha256

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: worldseed-windows-x64
          path: |
            worldseed-windows-x64.zip
            worldseed-windows-x64.zip.sha256
            MANIFEST.txt
            evidence/preview/*.png
            evidence/preview/selftest.txt
            evidence/preview/perf.txt
            evidence/live/*.png
            evidence/live/headless.txt
            evidence/live/tour-a.txt

  publish:
    name: publish prerelease
    runs-on: ubuntu-24.04
    needs: [verify, build-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: worldseed-windows-x64
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.version }}"
          fi
          printf '%s\n' \
            "Worldseed Engine onizleme surumu (P11 - urunlestirme ve ilk release)." \
            "" \
            "Bu surumde urun artik CANLI bir gozlem uygulamasi: dunya gercek zamanli" \
            "ilerler, siz kamerayi gezdirir, canli secip inceler, haritayi ve istatistikleri" \
            "gorur, kaydedip geri yuklersiniz. Dunya, yonetmen ve ses kendi C17 kodumuzdadir." \
            "" \
            "Canli uygulama (Windows):" \
            "  worldseed.exe --live               pencere modunda canli dunya" \
            "  worldseed.exe --live --fullscreen  tam ekran canli dunya" \
            "  Tuslar: Space duraklat, +/- hiz, V kip (auto/free/follow/map), N/P canli sec," \
            "  G istatistik, H yardim, [ ] saat, S/L kaydet/yukle, ok/WASD serbest kamera, Esc cikis." \
            "" \
            "Kanit (penceresiz, her makinede calisir):" \
            "  worldseed.exe --live-headless 3 --size 1280x720  kare zamanlamasi + dunya ozeti" \
            "  worldseed.exe --live-tour cikti --size 1280x720 deterministik tur (gorunum/kayit-yukle)" \
            "  live/*.png turun gercek kareleri, live/manifest.txt tur ozetini icerir." \
            "" \
            "Sabit referans sahneler de duruyor: worldseed.exe --list, --scene N." \
            "preview/*.png her sahnenin gercek CPU referans render ciktisidir." \
            "preview/perf.txt donanim profilini ve CPU/GPU olcumlerini icerir." \
            "MANIFEST.txt paketteki her dosyanin SHA-256 ve boyutunu listeler." \
            "" \
            "Bu surumde olanlar (tamami kendi C17 kodumuz): sahne/malzeme/isik/doku boru hatti" \
            "ve CPU referans renderer; prosedurel arazi/su/habitat/bitki/atmosfer; fizik" \
            "cekirdegi (yercekimi, temas, surtunme, restitusyon, ruzgar, kaldirma); referans" \
            "canli biyomekanigi (artikule beden + kapali-cevrim yuruyus); organizma/algi/" \
            "homeostaz/fayda tabanli davranis; dort tur icin ayri fiziksel beden ve tur-ozgu" \
            "yuruyus (kizil geyik, kizil tilki, Avrupa tavsani, yaban domuzu) ile populasyon/" \
            "ureme/olum/av-avci ekosistemi; kalici cok olcekli dunya (region streaming," \
            "near/mid/far, kamera disi ilerleme, checkpoint, journal, deterministik replay);" \
            "olay-tabanli sinematik yonetmen ve prosedurel ses manzarasi; GPU icin OpenCL C 1.2" \
            "kernel + CPU fallback ve deterministik cok cekirdekli zamanlayici. GPU yalniz" \
            "gercek kazanc oldugunda kullanilir (ADR-001)." \
            "" \
            "Bilinen sinirlamalar: 4K/30 FPS referans donanim hedefi henuz olculup gecilemedi;" \
            "GPU compute cihazi olmayan makinede CPU yolu kullanilir ve ic cozunurluk otomatik" \
            "olceklendirilir; ses calma cihazi arayuzu sonraki surumdedir (WAV uretilir)." \
            "" \
            "Kanit: worldseed-windows-x64.zip (worldseed.exe + preview/ + live/ + MANIFEST.txt)," \
            "sha256 dosyasi, ekteki PNG kareleri ve CI artefaktlari." \
            > notes.md
          gh release create "$tag" \
            worldseed-windows-x64.zip worldseed-windows-x64.zip.sha256 \
            MANIFEST.txt \
            evidence/preview/orbit.png evidence/preview/lowlight.png \
            evidence/preview/spheres.png evidence/preview/materials.png \
            evidence/preview/textured.png evidence/preview/sky.png \
            evidence/preview/terrain_day.png evidence/preview/terrain_dusk.png \
            evidence/preview/terrain_weather.png             evidence/preview/terrain_physics.png \
            evidence/preview/creature_walk.png \
            evidence/preview/organism_forage.png \
            evidence/preview/ecosystem.png \
            evidence/preview/world_stream.png \
            evidence/preview/director_shot.png \
            evidence/preview/soundscape.png \
            evidence/live/*.png \
            evidence/live/manifest.txt \
            --title "$tag" \
            --prerelease \
            --notes-file notes.md
