name: Release

# Release flow. Publishing authority is delegated to OpenHands by the project
# owner (see docs/adr/ADR-007-yetki-devri-ve-release.md): when all mandatory
# gates pass, a release is published without asking again.
#
# A release is created only for a version tag on main after CI has passed.
# Documentation/infrastructure-only changes are not product releases.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v0.1.0-preview)"
        required: true

permissions:
  contents: write

jobs:
  verify:
    name: verify gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Plan integrity gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, sys
          parts = sorted(Path("docs/plan-bundle").glob("part-*.txt"))
          payload = base64.b64decode("".join(p.read_text(encoding="ascii").strip() for p in parts), validate=True)
          expected = "69c49e5d7868fe1d83c2559f5da703a95eb443d18e4a5bd8b29eaa6c5a8f2f5a"
          if hashlib.sha256(payload).hexdigest() != expected:
              sys.exit("plan bundle digest mismatch")
          print("plan integrity ok")
          PY

  build-windows:
    name: windows x64 package
    runs-on: windows-2022
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package (portable folder + zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence/preview | Out-Null
          $exe = "build/src/app/Release/worldseed.exe"
          $scenes = "orbit","lowlight","spheres","materials","textured","sky","terrain_day","terrain_dusk","terrain_weather","terrain_physics","creature_walk","organism_forage","ecosystem","world_stream"
          for ($i = 0; $i -lt $scenes.Count; $i++) {
            $s = $scenes[$i]
            & $exe --capture "evidence/preview/$s.ppm" --scene $i --size 1280x720
            & tools/ppm2png.ps1 -In "evidence/preview/$s.ppm" -Out "evidence/preview/$s.png"
          }
          & $exe --selftest --size 640x360 | Tee-Object -FilePath evidence/preview/selftest.txt

          $stage = "stage/worldseed"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe "$stage/worldseed.exe"
          New-Item -ItemType Directory -Force -Path "$stage/preview" | Out-Null
          Copy-Item evidence/preview/*.png "$stage/preview/"
          @(
            "Worldseed Engine preview (P8 - kalici ve cok olcekli dunya).",
            "Calistirma: worldseed.exe --scene 13 --size 1280x720",
            "Sahneler: worldseed.exe --list",
            "Kanit: preview/*.png (CPU referans renderer ciktilari) ve CI artefaktlari.",
            "Bu bir onizleme surumudur; sinematik yonetmen sonraki asamadadir."
          ) | Set-Content -Path "$stage/README.txt"
          Compress-Archive -Path "$stage/*" -DestinationPath "worldseed-windows-x64.zip" -Force
          Get-FileHash worldseed-windows-x64.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  worldseed-windows-x64.zip" } |
            Set-Content -Path worldseed-windows-x64.zip.sha256

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: worldseed-windows-x64
          path: |
            worldseed-windows-x64.zip
            worldseed-windows-x64.zip.sha256
            evidence/preview/*.png
            evidence/preview/selftest.txt

  publish:
    name: publish prerelease
    runs-on: ubuntu-24.04
    needs: [verify, build-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: worldseed-windows-x64
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.version }}"
          fi
          printf '%s\n' \
            "Worldseed Engine onizleme surumu (P8 - kalici ve cok olcekli dunya)." \
            "" \
            "Bu paket, kendi C17 CPU referans renderer'imizle uretilen sabit sahneleri gosterir." \
            "worldseed.exe --list ile sahne listesini, --scene N ile secimi gorursunuz." \
            "preview/ klasorunde her sahnenin gercek render ciktisi PNG olarak eklenmistir." \
            "" \
            "Bu surumde olanlar: sahne/geometri/malzeme/isik/doku boru hatti, CPU referans" \
            "renderer, prosedurel arazi/su/habitat/bitki/atmosfer, kendi C17 fizik cekirdegi" \
            "(yercekimi, temas, surtunme, restitusyon, ruzgar, kaldirma), terrain_physics" \
            "golden sahnesi, P5 referans canli biyomekanigi (artikule beden, kapali-cevrim" \
            "yuruyus kontrolcusu, creature_walk golden sahnesi), P6 organizma/davranis" \
            "(algi, homeostaz, fayda tabanli davranis, sinirli ogrenme, organism_forage" \
            "golden sahnesi) ve P7 ekosistem: kendi C17 populasyon/enerji modeli, besin agi," \
            "ureme/olum, av-avci eslesmesi ve dordu birden kalici temsili tur (kizil geyik," \
            "kizil tilki, Avrupa tavsani, yaban domuzu) icin ayri fiziksel beden ve tur-ozgu" \
            "yuruyus; ecosystem golden sahnesi. P8 kalici ve cok olcekli dunya: bolge" \
            "geometrisi, region streaming, near/mid/far simulasyon seviyeleri, kamera disi" \
            "dunya ilerlemesi, bolge unload/load (durum korunur), checkpoint kaydet/yukle," \
            "olay gunlugu (journal) ve deterministik replay; world_stream golden sahnesi;" \
            "golden-scene kaniti ve determinizm testleri." \
            "Bu surumde henuz olmayanlar: sinematik yonetmen (sonraki asama)." \
            "" \
            "Kanit: bu surumun ekleri (preview/*.png), sha256 dosyasi ve CI artefaktlari." \
            > notes.md
          gh release create "$tag" \
            worldseed-windows-x64.zip worldseed-windows-x64.zip.sha256 \
            evidence/preview/orbit.png evidence/preview/lowlight.png \
            evidence/preview/spheres.png evidence/preview/materials.png \
            evidence/preview/textured.png evidence/preview/sky.png \
            evidence/preview/terrain_day.png evidence/preview/terrain_dusk.png \
            evidence/preview/terrain_weather.png             evidence/preview/terrain_physics.png \
            evidence/preview/creature_walk.png \
            evidence/preview/organism_forage.png \
            evidence/preview/ecosystem.png \
            evidence/preview/world_stream.png \
            --title "$tag" \
            --prerelease \
            --notes-file notes.md
