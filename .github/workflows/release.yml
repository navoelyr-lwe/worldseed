name: Release

# Release flow. Publishing authority is delegated to OpenHands by the project
# owner (see docs/adr/ADR-007-yetki-devri-ve-release.md): when all mandatory
# gates pass, a release is published without asking again.
#
# A release is created only for a version tag on main after CI has passed.
# Documentation/infrastructure-only changes are not product releases.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish (e.g. v0.1.0-preview)"
        required: true

permissions:
  contents: write

jobs:
  verify:
    name: verify gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Plan integrity gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, sys
          parts = sorted(Path("docs/plan-bundle").glob("part-*.txt"))
          payload = base64.b64decode("".join(p.read_text(encoding="ascii").strip() for p in parts), validate=True)
          expected = "69c49e5d7868fe1d83c2559f5da703a95eb443d18e4a5bd8b29eaa6c5a8f2f5a"
          if hashlib.sha256(payload).hexdigest() != expected:
              sys.exit("plan bundle digest mismatch")
          print("plan integrity ok")
          PY

  # Primary Windows package build on GitHub-hosted runners. Kept as the
  # canonical path; while the hosted runner pool is unavailable for this private
  # repository (see docs/CI-VE-DAL-KORUMASI.md) the self-hosted job below builds
  # the same package from the same script.
  build-windows:
    name: windows x64 package
    runs-on: windows-2022
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package (portable folder + zip)
        shell: pwsh
        run: ./tools/package-windows.ps1 -BuildDir build -Version "${{ github.event.inputs.version || github.ref_name }}"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: worldseed-windows-x64
          path: |
            worldseed-windows-x64.zip
            worldseed-windows-x64.zip.sha256
            MANIFEST.txt
            evidence/preview/*.png
            evidence/preview/selftest.txt
            evidence/preview/perf.txt
            evidence/live/tour-a/*.png
            evidence/live/tour-a/manifest.txt
            evidence/live/tour-a/tour-manifest.txt
            evidence/live/headless.txt
            evidence/live/tour-a.txt
            evidence/live/select/*.png
            evidence/live/select/select-manifest.txt
            evidence/live/select.txt
            evidence/live/export-a/frame-*.png
            evidence/live/export-a/soundscape.wav
            evidence/live/export-a/export-manifest.txt
            evidence/live/export.txt
            evidence/quality/quality.csv
            evidence/quality/quality.txt
            evidence/motion/motion.csv
            evidence/motion/motion.txt

  # Resilient path: build the identical package on the isolated self-hosted
  # Windows runner when the hosted pool is unavailable. The publish job consumes
  # whichever job produced the artifact.
  build-windows-selfhosted:
    name: windows x64 package (self-hosted)
    runs-on: [self-hosted, windows, x64, worldseed-gui]
    needs: [verify, build-windows]
    # Fallback only: run when the hosted Windows job did not succeed, so the
    # canonical artifact name is uploaded exactly once.
    if: always() && needs.verify.result == 'success' && needs.build-windows.result != 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Configure (MSVC x64)
        shell: pwsh
        run: cmake -S . -B build-rel -A x64 -DCMAKE_BUILD_TYPE=Release -DWS_WARNINGS_AS_ERRORS=ON
      - name: Build
        shell: pwsh
        run: cmake --build build-rel --config Release
      - name: Test
        shell: pwsh
        run: ctest --test-dir build-rel -C Release --output-on-failure
      - name: Package (portable folder + zip)
        shell: pwsh
        run: ./tools/package-windows.ps1 -BuildDir build-rel -Version "${{ github.event.inputs.version || github.ref_name }}"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: worldseed-windows-x64
          path: |
            worldseed-windows-x64.zip
            worldseed-windows-x64.zip.sha256
            MANIFEST.txt
            evidence/preview/*.png
            evidence/preview/selftest.txt
            evidence/preview/perf.txt
            evidence/live/tour-a/*.png
            evidence/live/tour-a/manifest.txt
            evidence/live/tour-a/tour-manifest.txt
            evidence/live/headless.txt
            evidence/live/tour-a.txt
            evidence/live/select/*.png
            evidence/live/select/select-manifest.txt
            evidence/live/select.txt
            evidence/live/export-a/frame-*.png
            evidence/live/export-a/soundscape.wav
            evidence/live/export-a/export-manifest.txt
            evidence/live/export.txt
            evidence/quality/quality.csv
            evidence/quality/quality.txt
            evidence/motion/motion.csv
            evidence/motion/motion.txt

  publish:
    name: publish prerelease
    runs-on: ubuntu-24.04
    needs: [verify, build-windows, build-windows-selfhosted]
    if: always() && needs.verify.result == 'success' && (needs.build-windows.result == 'success' || needs.build-windows-selfhosted.result == 'success')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: worldseed-windows-x64
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.version }}"
          fi
          printf '%s\n' \
            "Worldseed Engine onizleme surumu (P12 - CPU render performansi, gercek GPU dogrulamasi, gorsel ve hareket kalite kapilari)." \
            "" \
            "Bu surumde urun CANLI bir gozlem uygulamasi olmaya devam eder: dunya gercek" \
            "zamanli ilerler, siz kamerayi gezdirir, canli secip inceler, haritayi ve" \
            "istatistikleri gorur, kaydedip geri yuklersiniz. Dunya, yonetmen ve ses kendi" \
            "C17 kodumuzdadir. Bu surumun ana yeniligi RENDER PERFORMANSI: CPU referans" \
            "renderer GORUNTUYU BIT-OZDES biraka hizlandirildi. Kare basina kose hazirligi" \
            "(prepass) bir kez yapilip butun goruntu bantlarinca paylasilir; yakin duzlemin" \
            "onundeki ucgenler icin hizli yol vardir; bandin satir araligina degmeyen" \
            "ucgenler o bantta atlanir; goruntu daha ince bantlara bolunerek yuk dengelenir." \
            "Golden 17 sahnenin tamaminda goruntu, derinlik, istatistik ve SHA-256 degerleri" \
            "birebir ayni kalir; yalniz sure degisir. Ayrica canli urun sahnesinin kare" \
            "zamanlari artik yuzdelik olarak raporlanir (--live-headless cikisinda p50/p95/" \
            "p99_ms) ve CI bu p95 kapisini zorunlu tutar; tek bir FPS orneklemesi yayin" \
            "olcutu sayilmaz." \
            "" \
            "Bu surumde GORSEL KALITE KONTROL LISTESI de eklendi: alti urun referans sahnesi" \
            "(orman/cayir/gece/yagmur, ekosistem, canli yakin plan) geometri, isik/ton," \
            "materyal/renk ve atmosfer olcutleriyle OLCULUR ve esikleri gecmesi zorunludur." \
            "Ayni tohum iki kosuda bit-ozdes kare uretir. Golden hash tek basina estetik" \
            "kaliteyi kanitlamadigi icin bu kontrol listesi ayri bir yayin kapisidir" \
            "(docs/QUALITY-CHECKLIST.md); kanit quality/quality.csv icindedir." \
            "" \
            "Hareket kalitesi de OLCULUR: tek bir kare hareketi gosteremez, bu yuzden" \
            "referans dort ayakli canli gercek yuruyus denetleyicisiyle kosulur ve" \
            "ilerleme, hiz, puruzsuzluk (kutle merkezi ivmesi), denge (govde egimi)," \
            "ayak temasi ve enerji esikleri zorunlu tutulur; ayni tohum ayni olcumleri" \
            "verir. Kanit quality/motion.csv icindedir." \
            "" \
            "GERCEK GPU DOGRULAMASI: izole Windows x64 test makinesinde gercek bir GPU" \
            "(NVIDIA RTX 3060 Laptop, OpenCL 3.0 CUDA, 30 birim, 6 GB) bulundu ve olculdu." \
            "CPU/GPU semantik karsilastirma tolerans icinde (semantic_match=ok); dosemeli" \
            "(tiled) OpenCL C 1.2 raster cekirdegi referans GPU cekirdeginden 13x hizli ve" \
            "cikti BIT-OZDES (tiled bit_identical=1); aygit kaybi CPU geri donusune temiz" \
            "kapaniyor (device_loss_recovered=1). Referans GPU cekirdegi bu is yukunde CPU'dan" \
            "yavas oldugu icin karar use_cpu; yani GPU yalnizca gercekten kazanc sagladiginda" \
            "onerilir. TAM SAHNE GPU RENDERER (OpenCL C 1.2; kernels/ws_scene.cl + src/render/" \
            "ws_gpu_scene.c) artik CANLI URUN DONGUSUNE baglidir: ayarlar menusunde 'GPU render" \
            "(OpenCL)' satiri ve --live-gpu bayragi ile opt-in acilir (varsayilan kapali). 17" \
            "katalog sahnesinde yapisal fark sifirdir (world_stream gibi es-duzlemli yuzeylerde" \
            "float/double derislik beraberligi nedeniyle renk farki belgelidir). Gercek izole" \
            "Windows runner'da native 3840x2160 canli urun dongusu (dunya adimi + ekoloji + canli" \
            "aktorler + kamera + render + HUD) GPU yolunda 10 dakika olculdu: p50 20,2 ms / p95" \
            "23,3 ms (~49 FPS), her kare cihazda cizildi (gpu_frames=29362, cpu_fallback_frames=0," \
            "gpu_errors=0, path=gpu). Ayni commit'te ayni adim bir kez p95 36,6 ms (esik asildi)" \
            "verdi: ~1,57x kosu-arasi salinim var; bu yuzden 4K/30 FPS kabulu MARJINALDIR ve nihai" \
            "kabul 12 GB sinifi referans donanimda alinmalidir." \
            "" \
            "Onceki surumlerin ozellikleri korunur: disa aktarma (zaman damgali kare dizisi" \
            "+ WAV), kamera yer/su carpismasi ve agac kacinma, ayarlar menusu (fare" \
            "destekli), dunya secim ekrani ve opt-in yonlu golge eslemesi (canli pencerede" \
            "T tusuyla)." \
            "" \
            "Canli uygulama (Windows):" \
            "  worldseed.exe --live               pencere modunda canli dunya" \
            "  worldseed.exe --live --fullscreen  tam ekran canli dunya" \
            "  Tuslar: Space duraklat, +/- hiz, V kip (auto/free/follow/map), N/P canli sec," \
            "  G istatistik, O ayarlar, M dunya secimi, T yonlu golge, H yardim, [ ] saat, S/L kaydet/yukle, ok/WASD serbest kamera, Esc cikis." \
            "" \
            "Kamera carpismasi ve dunya secimi: serbest kamera yere/suya gomulmez ve" \
            "gorulen agac govdelerinin disina yatay itilir; uygulama acildiginda secim" \
            "ekrani gosterilir - YENI dunya olustur, MEVCUT dunyayi yukle (kayit varsa)" \
            "veya ORNEK dunyayi ac. Bir satira FAREYLE tiklamak imleci o satira tasir;" \
            "vurgulanan satira ikinci tiklama satiri klavyedeki Enter gibi acar. Ornek" \
            "dunya sabit bir tohumla acilir ve bit-ozdes yeniden uretilir; mevcut dunya" \
            "secimi checkpoint'i bit-ozdes geri yukler. Secim ekrani gozlemci salt-okunurdur." \
            "" \
            "Kalici ayarlar: seciminiz worldseed.cfg dosyasina" \
            "yazilir ve sonraki acilista geri yuklenir - cozunurluk, ic render olcegi," \
            "baslangic gorunumu/saati, golge, tam ekran, metin boyutu, ana ses duzeyi," \
            "kamera hizi ve fare hassasiyeti. Pencerede O tusu ETKILESIMLI bir ayar" \
            "menusu acar: up/down (veya W/S) imleci tasir, left/right (veya A/D) secili" \
            "satiri degistirir, Enter uygular, B varsayilanlara doner, O/Esc kapatir." \
            "Acik komut satiri bayragi dosyayi gecersiz kilar; kanit kosulari" \
            "(headless/tur) ayar dosyasini okumaz/yazmaz, boylece olcumler sabit kalir." \
            "Ayar uygulamak yalnizca gozlemciyi degistirir, dunyayi degistirmez." \
            "" \
            "Kanit (penceresiz, her makinede calisir):" \
            "  worldseed.exe --live-headless 3 --size 1280x720  kare zamanlamasi (p50/p95/p99) + dunya ozeti" \
            "  worldseed.exe --live-tour cikti --size 1280x720 deterministik tur (gorunum/kayit-yukle)" \
            "  worldseed.exe --live-select cikti --size 1280x720 dunya secimi kaniti (yeni/yukle/ornek)" \
            "  worldseed.exe --live-export cikti --size 1280x720 disa aktarma kaniti (kare dizisi + WAV)" \
            "  worldseed.exe --live-bench 600 --live-gpu --size 3840x2160  canli 4K GPU kare-zamani kapisi (path=gpu)" \
            "  live/*.png turun gercek kareleri, live/manifest.txt tur ozetini icerir." \
            "" \
            "Sabit referans sahneler de duruyor: worldseed.exe --list, --scene N." \
            "preview/*.png her sahnenin gercek CPU referans render ciktisidir." \
            "preview/perf.txt donanim profilini ve CPU/GPU olcumlerini icerir." \
            "MANIFEST.txt paketteki her dosyanin SHA-256 ve boyutunu listeler." \
            "" \
            "Bu surumde olanlar (tamami kendi C17 kodumuz): sahne/malzeme/isik/doku boru hatti" \
            "ve CPU referans renderer; prosedurel arazi/su/habitat/bitki/atmosfer; fizik" \
            "cekirdegi (yercekimi, temas, surtunme, restitusyon, ruzgar, kaldirma); referans" \
            "canli biyomekanigi (artikule beden + kapali-cevrim yuruyus); organizma/algi/" \
            "homeostaz/fayda tabanli davranis; dort tur icin ayri fiziksel beden ve tur-ozgu" \
            "yuruyus (kizil geyik, kizil tilki, Avrupa tavsani, yaban domuzu) ile populasyon/" \
            "ureme/olum/av-avci ekosistemi; kalici cok olcekli dunya (region streaming," \
            "near/mid/far, kamera disi ilerleme, checkpoint, journal, deterministik replay);" \
            "olay-tabanli sinematik yonetmen ve prosedurel ses manzarasi; GPU icin OpenCL C 1.2" \
            "kernel + CPU fallback ve deterministik cok cekirdekli zamanlayici. GPU yalniz" \
            "gercek kazanc oldugunda kullanilir (ADR-001)." \
            "" \
            "Bilinen sinirlamalar: 4K/30 FPS kabulu bu 6 GB laptop GPU'da MARJINALDIR (p95 23-37 ms" \
            "salinir); nihai kabul 12 GB sinifi referans donanimda alinmalidir. GPU'da cizilen her" \
            "kare CPU referansiyla semantik eslesir (tolerans icinde) ve dosemeli (tiled) cekirdek" \
            "bit-ozdestir. CPU referans yolunda kalan buyuk maliyet piksel basina sis (exp) ve" \
            "spekuler (pow) cagrilaridir. GPU compute cihazi olmayan makinede CPU yolu kullanilir ve" \
            "ic cozunurluk otomatik olceklendirilir; aygit kaybi CPU geri donusune temiz kapanir." \
            "Ses calma cihazi arayuzu sonraki surumdedir (WAV uretilir)." \
            "" \
            "Kanit: worldseed-windows-x64.zip (worldseed.exe + preview/ + live/ + select/ + export/ + MANIFEST.txt)," \
            "sha256 dosyasi, ekteki PNG kareleri ve CI artefaktlari." \
            > notes.md
          gh release create "$tag" \
            worldseed-windows-x64.zip worldseed-windows-x64.zip.sha256 \
            MANIFEST.txt \
            evidence/preview/orbit.png evidence/preview/lowlight.png \
            evidence/preview/spheres.png evidence/preview/materials.png \
            evidence/preview/textured.png evidence/preview/sky.png \
            evidence/preview/shadows.png \
            evidence/preview/terrain_day.png evidence/preview/terrain_dusk.png \
            evidence/preview/terrain_weather.png             evidence/preview/terrain_physics.png \
            evidence/preview/creature_walk.png \
            evidence/preview/organism_forage.png \
            evidence/preview/ecosystem.png \
            evidence/preview/world_stream.png \
            evidence/preview/director_shot.png \
            evidence/preview/soundscape.png \
            evidence/live/tour-a/*.png \
            evidence/live/tour-a/tour-manifest.txt \
            evidence/live/select/*.png \
            evidence/live/select/select-manifest.txt \
            evidence/live/export-a/frame-*.png \
            evidence/live/export-a/soundscape.wav \
            evidence/live/export-a/export-manifest.txt \
            evidence/quality/quality.csv \
            evidence/quality/quality.txt \
            evidence/motion/motion.csv \
            evidence/motion/motion.txt \
            --title "$tag" \
            --prerelease \
            --notes-file notes.md
