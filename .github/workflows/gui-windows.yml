name: GUI (Windows, isolated runner)

# Real Windows GUI tests. These run only on a self-hosted, isolated, secretless
# Windows runner that is allowlisted for this repository. Fork/external PR code
# is never executed here: the job is gated on a trusted-ref allowlist below
# (same-repo PRs and the default branch only).
#
# Runner label set: [self-hosted, windows, x64, worldseed-gui].
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gui-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-gui:
    name: windows x64 gui/smoke
    runs-on: [self-hosted, windows, x64, worldseed-gui]
    # Trusted-ref allowlist: the default branch, and PRs whose head is a branch
    # of this same repository (never a fork). Untrusted fork code never reaches
    # the isolated runner.
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC x64)
        shell: pwsh
        run: cmake -S . -B build-gui -A x64 -DCMAKE_BUILD_TYPE=Release -DWS_WARNINGS_AS_ERRORS=ON

      - name: Build
        shell: pwsh
        run: cmake --build build-gui --config Release

      - name: Unit tests
        shell: pwsh
        run: ctest --test-dir build-gui -C Release --output-on-failure

      - name: Headless smoke on isolated runner
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence/gui | Out-Null
          & build-gui/tools/Release/ws_smoke.exe evidence/gui/frame-gui.ppm 20260101 |
            Tee-Object -FilePath evidence/gui/smoke-gui.txt
          if (-not (Select-String -Path evidence/gui/smoke-gui.txt -Pattern "WS_SMOKE_OK" -Quiet)) { exit 1 }

      - name: App headless capture on isolated runner
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence/gui/app | Out-Null
          & build-gui/src/app/Release/worldseed.exe --selftest --size 640x360 |
            Tee-Object -FilePath evidence/gui/app/selftest.txt
          if (-not (Select-String -Path evidence/gui/app/selftest.txt -Pattern "APP_SELFTEST_OK" -Quiet)) { exit 1 }

      - name: Real window launch and screenshot
        shell: pwsh
        run: |
          # Launch the actual Win32 window, let it present a frame, capture the
          # desktop, then close it. This is a real GUI test, not a headless one.
          # Scene 15 is the P9 director_shot result: the cinematic observer runs
          # over the ecosystem's real life events, plans and drives a camera, and
          # the window shows the animal the director chose, not a pose.
          New-Item -ItemType Directory -Force -Path evidence/gui/app | Out-Null
          $exe = "build-gui/src/app/Release/worldseed.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--scene","15","--size","1280x720" -PassThru
          Start-Sleep -Seconds 5
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $gfx = [System.Drawing.Graphics]::FromImage($bmp)
          $gfx.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("evidence/gui/app/window.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $gfx.Dispose(); $bmp.Dispose()
          if (-not $proc.HasExited) { $proc.CloseMainWindow() | Out-Null; Start-Sleep -Seconds 2 }
          if (-not $proc.HasExited) { $proc.Kill() }
          if (-not (Test-Path "evidence/gui/app/window.png")) { Write-Error "no window screenshot produced"; exit 1 }

      - name: Live application window and screenshot
        shell: pwsh
        run: |
          # P11: launch the real interactive live world in its Win32 window, let
          # it present several frames, capture the desktop, then close it. This
          # exercises the windowed presentation path (Win32 + GDI blit) that the
          # headless evidence cannot: a real window, a real GDI-presented frame.
          $exe = "build-gui/src/app/Release/worldseed.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--live","--live-no-select","--size","1280x720" -PassThru
          Start-Sleep -Seconds 8
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $gfx = [System.Drawing.Graphics]::FromImage($bmp)
          $gfx.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("evidence/gui/app/live-window.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $gfx.Dispose(); $bmp.Dispose()
          if (-not $proc.HasExited) { $proc.CloseMainWindow() | Out-Null; Start-Sleep -Seconds 2 }
          if (-not $proc.HasExited) { $proc.Kill() }
          if (-not (Test-Path "evidence/gui/app/live-window.png")) { Write-Error "no live window screenshot produced"; exit 1 }

      - name: World selection window and screenshot
        shell: pwsh
        run: |
          # docs/17 "Ana deneyim": on open the user chooses a world. Launch the
          # real window WITHOUT --live-no-select so the startup selection screen
          # is shown, capture the desktop, then close it. This is the real GUI
          # proof that the world-selection screen appears before the live view.
          New-Item -ItemType Directory -Force -Path evidence/gui/app | Out-Null
          $exe = "build-gui/src/app/Release/worldseed.exe"
          $proc = Start-Process -FilePath $exe -ArgumentList "--live","--size","1280x720" -PassThru
          Start-Sleep -Seconds 5
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $bounds = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $gfx = [System.Drawing.Graphics]::FromImage($bmp)
          $gfx.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
          $bmp.Save("evidence/gui/app/world-select-window.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $gfx.Dispose(); $bmp.Dispose()
          if (-not $proc.HasExited) { $proc.CloseMainWindow() | Out-Null; Start-Sleep -Seconds 2 }
          if (-not $proc.HasExited) { $proc.Kill() }
          if (-not (Test-Path "evidence/gui/app/world-select-window.png")) { Write-Error "no world-selection window screenshot produced"; exit 1 }

      - name: Live headless evidence on isolated runner
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence/gui/live | Out-Null
          & build-gui/src/app/Release/worldseed.exe --live-headless 2 --size 640x360 |
            Tee-Object -FilePath evidence/gui/live/headless.txt
          if (-not (Select-String -Path evidence/gui/live/headless.txt -Pattern "LIVE_HEADLESS_OK" -Quiet)) { exit 1 }
          if (-not (Select-String -Path evidence/gui/live/headless.txt -Pattern "p95_ms=" -Quiet)) { exit 1 }
          & build-gui/src/app/Release/worldseed.exe --live-tour evidence/gui/live/tour --size 640x360 |
            Tee-Object -FilePath evidence/gui/live/tour.txt
          if (-not (Select-String -Path evidence/gui/live/tour.txt -Pattern "LIVE_TOUR_OK" -Quiet)) { exit 1 }
          if (-not (Select-String -Path evidence/gui/live/tour.txt -Pattern "saved=1 loaded=1 roundtrip=1" -Quiet)) { exit 1 }
          # shadows_verified is written to the tour manifest, not stdout.
          if (-not (Select-String -Path evidence/gui/live/tour/manifest.txt -Pattern "shadows_verified=1" -Quiet)) { exit 1 }
          # single-step time control (docs/17) is proven in the same manifest.
          if (-not (Select-String -Path evidence/gui/live/tour/manifest.txt -Pattern "single_step_verified=1" -Quiet)) { exit 1 }
          # interactive settings menu (docs/17 item 9) is proven in the same manifest.
          if (-not (Select-String -Path evidence/gui/live/tour/manifest.txt -Pattern "settings_menu_verified=1" -Quiet)) { exit 1 }
          # world-selection screen (docs/17 "Ana deneyim") is proven in the same manifest.
          if (-not (Select-String -Path evidence/gui/live/tour/manifest.txt -Pattern "world_select_verified=1" -Quiet)) { exit 1 }
          # mouse-driven menu selection (docs/17 item 9 / "Ana deneyim") is proven in the same manifest.
          if (-not (Select-String -Path evidence/gui/live/tour/manifest.txt -Pattern "menu_click_verified=1" -Quiet)) { exit 1 }
          # free-camera ground collision (docs/17 "Kamera çarpışması") is proven in the same manifest.
          if (-not (Select-String -Path evidence/gui/live/tour/manifest.txt -Pattern "camera_collision_verified=1" -Quiet)) { exit 1 }
          # free-camera solid-obstacle (tree) avoidance (docs/17) is proven in the same manifest.
          if (-not (Select-String -Path evidence/gui/live/tour/manifest.txt -Pattern "tree_avoidance_verified=1" -Quiet)) { exit 1 }
          # The world-selection evidence mode proves new / load / sample choices.
          & build-gui/src/app/Release/worldseed.exe --live-select evidence/gui/live/select --size 640x360 |
            Tee-Object -FilePath evidence/gui/live/select.txt
          if (-not (Select-String -Path evidence/gui/live/select.txt -Pattern "LIVE_SELECT_OK" -Quiet)) { exit 1 }
          foreach ($k in @("can_load=1","sample_reproducible=1","load_restored=1","new_fresh=1","readonly=1")) {
            if (-not (Select-String -Path evidence/gui/live/select/select-manifest.txt -Pattern $k -Quiet)) { exit 1 }
          }

      - name: Replay evidence on isolated runner
        shell: pwsh
        run: |
          # P11 replay (docs/17 item 8): re-observe recorded history. The newest
          # recorded sample must reproduce the live digest exactly and leaving
          # replay must restore the live world.
          & build-gui/src/app/Release/worldseed.exe --live-replay evidence/gui/live/replay --size 640x360 |
            Tee-Object -FilePath evidence/gui/live/replay.txt
          if (-not (Select-String -Path evidence/gui/live/replay.txt -Pattern "LIVE_REPLAY_OK" -Quiet)) { exit 1 }
          if (-not (Select-String -Path evidence/gui/live/replay/replay-manifest.txt -Pattern "newest_matches_live=1" -Quiet)) { exit 1 }
          if (-not (Select-String -Path evidence/gui/live/replay/replay-manifest.txt -Pattern "live_restored=1" -Quiet)) { exit 1 }

      - name: Export evidence on isolated runner
        shell: pwsh
        run: |
          # P11 export (docs/17 "Dışa aktarma"): timestamped frame sequence + WAV.
          # Two exports of the same seed must agree frame-for-frame and sample-for-sample.
          & build-gui/src/app/Release/worldseed.exe --live-export evidence/gui/live/export-a --size 640x360 --live-export-seconds 1 |
            Tee-Object -FilePath evidence/gui/live/export.txt
          if (-not (Select-String -Path evidence/gui/live/export.txt -Pattern "LIVE_EXPORT_OK" -Quiet)) { exit 1 }
          if (-not (Select-String -Path evidence/gui/live/export-a/export-manifest.txt -Pattern "audio_nonzero=1" -Quiet)) { exit 1 }
          & build-gui/src/app/Release/worldseed.exe --live-export evidence/gui/live/export-b --size 640x360 --live-export-seconds 1 | Out-Null
          Get-ChildItem evidence/gui/live/export-a/frame-*.ppm | ForEach-Object {
            $b = Join-Path "evidence/gui/live/export-b" $_.Name
            if ((Get-FileHash $_.FullName).Hash -ne (Get-FileHash $b).Hash) {
              Write-Error "live export $($_.Name) not reproducible"; exit 1
            }
          }
          if ((Get-FileHash evidence/gui/live/export-a/soundscape.wav).Hash -ne (Get-FileHash evidence/gui/live/export-b/soundscape.wav).Hash) {
            Write-Error "live export WAV not reproducible"; exit 1
          }

      - name: Directional shadows evidence on isolated runner
        shell: pwsh
        run: |
          # P12: the on/off directional-shadow pair must differ and the shadowed
          # frame must not be brighter than the unshadowed one. This gate runs on
          # the real Windows runner because the GitHub-hosted pool is unavailable
          # for this private repository (see PR notes); it is the same assertion
          # the hosted CI job makes.
          $diff = & build-gui/tools/Release/ws_imgdiff.exe `
            evidence/gui/live/tour/step-08-shadows_off.ppm `
            evidence/gui/live/tour/step-09-shadows_on.ppm
          $diff | Out-File -Encoding ascii evidence/gui/live/shadows_diff.txt
          $diff | Write-Output
          if (-not ($diff | Select-String -Pattern "WS_IMGDIFF_OK" -Quiet)) { Write-Error "shadow pair diff failed"; exit 1 }
          $nd = [int]([regex]::Match(($diff -join " "), "differing=(\d+)").Groups[1].Value)
          if ($nd -le 0) { Write-Error "shadows changed nothing"; exit 1 }
          # Shadows only darken: signed mean (off - on) must be non-negative.
          $sm = [regex]::Match(($diff -join " "), "signed_mean a-b: r=(-?[0-9.]+)")
          if ([double]$sm.Groups[1].Value -lt 0) { Write-Error "shadowed frame brighter than unshadowed"; exit 1 }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke
          path: evidence/gui/
