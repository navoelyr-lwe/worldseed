name: Package test (temporary)

# TEMPORARY: validates tools/package-windows.ps1 on the isolated self-hosted
# Windows runner without publishing anything. Removed before PR merge.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pkgtest:
    name: package script test
    runs-on: [self-hosted, windows, x64, worldseed-gui]
    steps:
      - uses: actions/checkout@v4
      - name: Configure (MSVC x64)
        shell: pwsh
        run: cmake -S . -B build-rel -A x64 -DCMAKE_BUILD_TYPE=Release -DWS_WARNINGS_AS_ERRORS=ON
      - name: Build
        shell: pwsh
        run: cmake --build build-rel --config Release
      - name: Test
        shell: pwsh
        run: ctest --test-dir build-rel -C Release --output-on-failure
      - name: Package
        shell: pwsh
        run: ./tools/package-windows.ps1 -BuildDir build-rel -Version "v0.13.0-preview"
      - name: Verify package
        shell: pwsh
        run: |
          if (-not (Test-Path worldseed-windows-x64.zip)) { Write-Error "no zip"; exit 1 }
          if (-not (Test-Path worldseed-windows-x64.zip.sha256)) { Write-Error "no sha"; exit 1 }
          if (-not (Test-Path MANIFEST.txt)) { Write-Error "no manifest"; exit 1 }
          $size = (Get-Item worldseed-windows-x64.zip).Length
          Write-Output "PKG_ZIP_BYTES=$size"
          Get-Content worldseed-windows-x64.zip.sha256
          Write-Output "PKG_TEST_OK"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkgtest
          path: |
            worldseed-windows-x64.zip
            worldseed-windows-x64.zip.sha256
            MANIFEST.txt
