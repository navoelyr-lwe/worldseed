name: CI

# PR and push verification on GitHub-hosted runners only.
# Real Windows GUI tests run in the separate, isolated gui-windows workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-matrix:
    name: linux ${{ matrix.compiler }} ${{ matrix.build_type }} ${{ matrix.sanitizers }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            build_type: Debug
            sanitizers: on
          - compiler: gcc
            cc: gcc
            build_type: Release
            sanitizers: off
          - compiler: clang
            cc: clang
            build_type: Debug
            sanitizers: on
          - compiler: clang
            cc: clang
            build_type: Release
            sanitizers: off
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DWS_ENABLE_SANITIZERS=${{ matrix.sanitizers }} \
            -DWS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Headless smoke
        run: |
          mkdir -p evidence/smoke
          ./build/tools/ws_smoke evidence/smoke/frame-${{ matrix.compiler }}-${{ matrix.build_type }}.ppm 20260101 \
            | tee evidence/smoke/smoke-${{ matrix.compiler }}-${{ matrix.build_type }}.txt
          grep -q "WS_SMOKE_OK" evidence/smoke/smoke-${{ matrix.compiler }}-${{ matrix.build_type }}.txt

      - name: Determinism across seeds
        run: |
          # The same seed must produce a byte-identical frame; different seeds
          # must still produce a valid frame. Evidence: per-seed digests.
          for seed in 1 2 20260101; do
            ./build/tools/ws_smoke evidence/smoke/seed-$seed.ppm $seed \
              | tee evidence/smoke/seed-$seed.txt
          done
          d1=$(grep -o 'sha256=[0-9a-f]*' evidence/smoke/seed-1.txt | cut -d= -f2)
          d2=$(grep -o 'sha256=[0-9a-f]*' evidence/smoke/seed-2.txt | cut -d= -f2)
          test -n "$d1" || { echo "missing frame digest"; exit 1; }
          test "$d1" != "$d2" || { echo "distinct seeds produced identical frames"; exit 1; }
          ./build/tools/ws_smoke evidence/smoke/repeat.ppm 20260101 >/dev/null
          b=$(sha256sum evidence/smoke/repeat.ppm | cut -d' ' -f1)
          ./build/tools/ws_smoke evidence/smoke/repeat2.ppm 20260101 >/dev/null
          c=$(sha256sum evidence/smoke/repeat2.ppm | cut -d' ' -f1)
          test "$b" = "$c" || { echo "frame not reproducible"; exit 1; }

      - name: Benchmark
        run: |
          ./build/tools/ws_bench | tee evidence/smoke/bench-${{ matrix.compiler }}-${{ matrix.build_type }}.txt
          grep -q "WS_BENCH_OK" evidence/smoke/bench-${{ matrix.compiler }}-${{ matrix.build_type }}.txt

      - name: Golden scenes
        run: |
          mkdir -p evidence/golden
          ./build/tools/ws_golden evidence/golden 20260101 | tee evidence/golden/golden-${{ matrix.compiler }}-${{ matrix.build_type }}.txt
          grep -q "WS_GOLDEN_OK" evidence/golden/golden-${{ matrix.compiler }}-${{ matrix.build_type }}.txt
          # Same input must reproduce the same frame digests within a run.
          mkdir -p evidence/golden/repeat
          ./build/tools/ws_golden evidence/golden/repeat 20260101 >/dev/null
          for s in orbit lowlight spheres materials textured sky shadows terrain_day terrain_dusk terrain_weather terrain_physics creature_walk organism_forage ecosystem world_stream director_shot soundscape; do
            a=$(grep "^$s," evidence/golden/manifest.csv | cut -d, -f12)
            b=$(grep "^$s," evidence/golden/repeat/manifest.csv | cut -d, -f12)
            test "$a" = "$b" || { echo "golden scene $s not reproducible"; exit 1; }
          done

      - name: Golden reference comparison
        run: |
          # Tolerance, not equality: catches missing/misplaced geometry across
          # compilers and platforms while allowing tiny floating-point edges.
          # Static scenes are pixel-stable across compilers, so they stay tight.
          for s in orbit lowlight spheres materials textured sky shadows terrain_day terrain_dusk terrain_weather terrain_physics; do
            ./build/tools/ws_imgdiff evidence/golden/$s.ppm tests/golden/$s.ppm 3.0 0.99
          done
          # creature_walk runs an articulated rigid-body simulation, whose
          # transcendental libm calls differ in the last bits between MSVC's CRT
          # and glibc; the long dynamic run amplifies that into a sub-pixel pose
          # shift. The frame is still the same scene (same geometry, coverage and
          # lighting), so it is gated with a documented looser tolerance that
          # still fails on a missing or grossly misplaced creature.
          ./build/tools/ws_imgdiff evidence/golden/creature_walk.ppm tests/golden/creature_walk.ppm 3.0 0.80
          # organism_forage also runs the dynamic articulated simulation (settle,
          # then a heading-dependent rotation), so it carries the same cross-
          # compiler sub-pixel divergence and is gated the same way.
          ./build/tools/ws_imgdiff evidence/golden/organism_forage.ppm tests/golden/organism_forage.ppm 3.0 0.80
          # ecosystem settles and walks four articulated bodies, so it carries the
          # same dynamic-simulation divergence and is gated the same way.
          ./build/tools/ws_imgdiff evidence/golden/ecosystem.ppm tests/golden/ecosystem.ppm 3.0 0.80
          # world_stream runs the deterministic P8 host (integer/rational logic,
          # no transcendental libm in the hot path), so its tiles are pixel-stable
          # across compilers and it is gated tightly like the static scenes.
          ./build/tools/ws_imgdiff evidence/golden/world_stream.ppm tests/golden/world_stream.ppm 3.0 0.99
          # director_shot walks an articulated body at the position of a real
          # life event chosen by the P9 director, so it carries the same dynamic-
          # simulation cross-compiler divergence and is gated loosely.
          ./build/tools/ws_imgdiff evidence/golden/director_shot.ppm tests/golden/director_shot.ppm 3.0 0.80
          # soundscape renders voice-meter bars whose heights come from an
          # ecology run, so it is gated loosely like the other dynamic scenes.
          ./build/tools/ws_imgdiff evidence/golden/soundscape.ppm tests/golden/soundscape.ppm 3.0 0.80

      - name: Asset pipeline
        run: |
          mkdir -p evidence/assets
          ./build/tools/ws_assetgen evidence/assets | tee evidence/assets/assetgen.txt
          grep -q "WS_ASSETGEN_OK" evidence/assets/assetgen.txt
          # Regenerating must reproduce byte-identical assets (determinism) and
          # match the committed provenance record so it cannot silently drift.
          mkdir -p evidence/assets/repeat
          ./build/tools/ws_assetgen evidence/assets/repeat >/dev/null
          for a in cube plane sphere checker noise; do
            for ext in wsmesh wstex; do
              if [ -f evidence/assets/$a.$ext ]; then
                cmp evidence/assets/$a.$ext evidence/assets/repeat/$a.$ext \
                  || { echo "asset $a.$ext not reproducible"; exit 1; }
                cmp evidence/assets/$a.$ext assets/primitives/$a.$ext \
                  || { echo "committed asset $a.$ext differs from generator output"; exit 1; }
              fi
            done
          done

      - name: Application capture
        run: |
          # The user-visible preview app renders the same scenes headless and
          # writes real frame evidence. Its 320x240 output must be byte-identical
          # to the golden harness output from the same run, proving the app and
          # the harness share one scene/renderer path (portable across platforms;
          # the committed reference comparison above uses a tolerance).
          mkdir -p evidence/app
          ./build/src/app/worldseed --selftest --size 640x360 | tee evidence/app/selftest.txt
          grep -q "APP_SELFTEST_OK" evidence/app/selftest.txt
          ./build/src/app/worldseed --list | tee evidence/app/scenes.txt
          i=0
          for s in orbit lowlight spheres materials textured sky shadows terrain_day terrain_dusk terrain_weather terrain_physics creature_walk organism_forage ecosystem world_stream director_shot soundscape; do
            ./build/src/app/worldseed --capture "evidence/app/$s.ppm" --scene $i --size 320x240
            cmp "evidence/app/$s.ppm" "evidence/golden/$s.ppm" \
              || { echo "app frame $s differs from golden harness"; exit 1; }
            i=$((i + 1))
          done

      - name: Live application evidence
        run: |
          # P11: the interactive application. Drive the real headless live loop
          # (frame timing, world digest, coverage) and the deterministic tour
          # (view switches, animal selection, save/load roundtrip, stats panel).
          # Two tours must agree frame-for-frame: the observer is read-only.
          mkdir -p evidence/live/tour-a evidence/live/tour-b
          ./build/src/app/worldseed --live-headless 2 --size 320x180 | tee evidence/live/headless.txt
          grep -q "LIVE_HEADLESS_OK" evidence/live/headless.txt
          ./build/src/app/worldseed --live-tour evidence/live/tour-a --size 320x180 | tee evidence/live/tour-a.txt
          grep -q "LIVE_TOUR_OK" evidence/live/tour-a.txt
          grep -q "saved=1 loaded=1 roundtrip=1" evidence/live/tour-a.txt
          grep -q "single_step_verified=1" evidence/live/tour-a/manifest.txt
          grep -q "settings_menu_verified=1" evidence/live/tour-a/manifest.txt
          grep -q "world_select_verified=1" evidence/live/tour-a/manifest.txt
          grep -q "menu_click_verified=1" evidence/live/tour-a/manifest.txt
          grep -q "camera_collision_verified=1" evidence/live/tour-a/manifest.txt
          ./build/src/app/worldseed --live-tour evidence/live/tour-b --size 320x180 >/dev/null
          for f in evidence/live/tour-a/step-*.ppm; do
            b=$(basename "$f")
            cmp "$f" "evidence/live/tour-b/$b" \
              || { echo "live tour $b not reproducible"; exit 1; }
          done
          # World selection (docs/17 "Ana deneyim"): create a new world, open the
          # built-in sample world (reproducible) and load an existing checkpoint.
          ./build/src/app/worldseed --live-select evidence/live/select --size 320x180 \
            | tee evidence/live/select.txt
          grep -q "LIVE_SELECT_OK" evidence/live/select.txt
          grep -q "can_load=1" evidence/live/select/select-manifest.txt
          grep -q "sample_reproducible=1" evidence/live/select/select-manifest.txt
          grep -q "load_restored=1" evidence/live/select/select-manifest.txt
          grep -q "readonly=1" evidence/live/select/select-manifest.txt
          # Replay (P11 item 8): re-observe recorded history. The newest recorded
          # sample must reproduce the live digest exactly, and leaving replay must
          # restore the live world bit-exactly.
          ./build/src/app/worldseed --live-replay evidence/live/replay --size 320x180 \
            | tee evidence/live/replay.txt
          grep -q "LIVE_REPLAY_OK" evidence/live/replay.txt
          grep -q "newest_matches_live=1" evidence/live/replay/replay-manifest.txt
          grep -q "live_restored=1" evidence/live/replay/replay-manifest.txt
          # Directional shadows (P12): the on/off pair must differ and the
          # shadowed frame must not be brighter than the unshadowed one.
          ./build/tools/ws_imgdiff evidence/live/tour-a/step-08-shadows_off.ppm \
                                   evidence/live/tour-a/step-09-shadows_on.ppm \
            | tee evidence/live/shadows_diff.txt
          grep -q "WS_IMGDIFF_OK" evidence/live/shadows_diff.txt
          ndiff=$(grep -o 'differing=[0-9]*' evidence/live/shadows_diff.txt | cut -d= -f2)
          test "${ndiff:-0}" -gt 0 || { echo "shadows changed nothing"; exit 1; }

      - name: Soundscape audio evidence
        run: |
          # The P9 soundscape is our own C17 synthesis, not a recorded track.
          # Render a real WAV from a real ecology run, prove it carries signal,
          # and prove it is deterministic (same seed -> same PCM digest).
          mkdir -p evidence/audio
          ./build/tools/ws_audio evidence/audio/soundscape.wav 20260101 | tee evidence/audio/audio.txt
          grep -q "WS_AUDIO_OK" evidence/audio/audio.txt
          ./build/tools/ws_audio evidence/audio/repeat.wav 20260101 | tee evidence/audio/audio-repeat.txt >/dev/null
          a=$(grep -o 'sha256=[0-9a-f]*' evidence/audio/audio.txt | cut -d= -f2)
          b=$(grep -o 'sha256=[0-9a-f]*' evidence/audio/audio-repeat.txt | cut -d= -f2)
          test -n "$a" && test "$a" = "$b" || { echo "soundscape not reproducible"; exit 1; }

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.compiler }}-${{ matrix.build_type }}-${{ matrix.sanitizers }}
          path: evidence/

  # Dedicated OpenCL job: installs a CPU OpenCL 1.2 ICD (pocl) so the OpenCL C
  # 1.2 raster kernel is really compiled and run, then checks it reproduces the
  # CPU rasterizer within tolerance and that a device loss falls back cleanly.
  # The product never ships this runtime (ADR-001); it is CI test tooling.
  opencl-cpu:
    name: opencl cpu kernel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and OpenCL ICD
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pocl-opencl-icd ocl-icd-libopencl1 clinfo
          clinfo -l || true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DWS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build

      - name: GPU unit tests
        run: ctest --test-dir build -R gpu --output-on-failure

      - name: GPU semantic comparison and device-loss recovery
        run: |
          mkdir -p evidence/gpu
          ./build/tools/ws_gpu_check | tee evidence/gpu/gpu_check.txt
          grep -q "WS_GPU_CHECK_OK" evidence/gpu/gpu_check.txt
          grep -q "gpu=available" evidence/gpu/gpu_check.txt
          grep -q "semantic_match=ok" evidence/gpu/gpu_check.txt
          grep -q "device_loss_recovered=1" evidence/gpu/gpu_check.txt

      - name: Performance and scaling evidence
        run: |
          mkdir -p evidence/perf
          ./build/tools/ws_perf --quick | tee evidence/perf/perf.txt
          grep -q "WS_PERF_OK" evidence/perf/perf.txt
          grep -q "identical=1" evidence/perf/perf.txt

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: evidence-opencl-cpu
          path: evidence/

  windows-msvc:
    name: windows msvc ${{ matrix.build_type }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DWS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Unit tests
        run: ctest --test-dir build -C ${{ matrix.build_type }} --output-on-failure

      - name: Headless smoke
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence/smoke | Out-Null
          & build/tools/${{ matrix.build_type }}/ws_smoke.exe evidence/smoke/frame-msvc-${{ matrix.build_type }}.ppm 20260101 |
            Tee-Object -FilePath evidence/smoke/smoke-msvc-${{ matrix.build_type }}.txt
          if (-not (Select-String -Path evidence/smoke/smoke-msvc-${{ matrix.build_type }}.txt -Pattern "WS_SMOKE_OK" -Quiet)) { exit 1 }

      - name: Golden scenes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence/golden | Out-Null
          & build/tools/${{ matrix.build_type }}/ws_golden.exe evidence/golden 20260101 |
            Tee-Object -FilePath evidence/golden/golden-msvc-${{ matrix.build_type }}.txt
          if (-not (Select-String -Path evidence/golden/golden-msvc-${{ matrix.build_type }}.txt -Pattern "WS_GOLDEN_OK" -Quiet)) { exit 1 }
          # Same input must reproduce the same frame digests within a run.
          New-Item -ItemType Directory -Force -Path evidence/golden/repeat | Out-Null
          & build/tools/${{ matrix.build_type }}/ws_golden.exe evidence/golden/repeat 20260101 | Out-Null
          foreach ($s in "orbit","lowlight","spheres","materials","textured","sky","shadows","terrain_day","terrain_dusk","terrain_weather","terrain_physics","creature_walk","organism_forage","ecosystem","world_stream","director_shot","soundscape") {
            $a = (Select-String -Path evidence/golden/manifest.csv -Pattern "^$s,").Line.Split(",")[11]
            $b = (Select-String -Path evidence/golden/repeat/manifest.csv -Pattern "^$s,").Line.Split(",")[11]
            if ($a -ne $b) { Write-Error "golden scene $s not reproducible"; exit 1 }
          }

      - name: Golden reference comparison
        shell: pwsh
        run: |
          # Static scenes are pixel-stable across compilers: tight gate.
          foreach ($s in "orbit","lowlight","spheres","materials","textured","sky","shadows","terrain_day","terrain_dusk","terrain_weather","terrain_physics") {
            & build/tools/${{ matrix.build_type }}/ws_imgdiff.exe "evidence/golden/$s.ppm" "tests/golden/$s.ppm" 3.0 0.99
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          # creature_walk is a dynamic rigid-body simulation; the last-bit libm
          # differences between the MSVC CRT and glibc amplify into a sub-pixel
          # pose shift, so it is gated with a documented looser tolerance.
          & build/tools/${{ matrix.build_type }}/ws_imgdiff.exe "evidence/golden/creature_walk.ppm" "tests/golden/creature_walk.ppm" 3.0 0.80
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # organism_forage also runs the dynamic articulated simulation, so it is
          # gated the same way.
          & build/tools/${{ matrix.build_type }}/ws_imgdiff.exe "evidence/golden/organism_forage.ppm" "tests/golden/organism_forage.ppm" 3.0 0.80
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # ecosystem settles and walks four articulated bodies, so it is gated
          # the same way.
          & build/tools/${{ matrix.build_type }}/ws_imgdiff.exe "evidence/golden/ecosystem.ppm" "tests/golden/ecosystem.ppm" 3.0 0.80
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # world_stream runs the deterministic P8 host, so its tiles are pixel-
          # stable across compilers: tight gate like the static scenes.
          & build/tools/${{ matrix.build_type }}/ws_imgdiff.exe "evidence/golden/world_stream.ppm" "tests/golden/world_stream.ppm" 3.0 0.99
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # director_shot walks an articulated body at a real event position, so
          # it is gated loosely like the other dynamic scenes.
          & build/tools/${{ matrix.build_type }}/ws_imgdiff.exe "evidence/golden/director_shot.ppm" "tests/golden/director_shot.ppm" 3.0 0.80
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # soundscape bars come from an ecology run, so it is gated loosely too.
          & build/tools/${{ matrix.build_type }}/ws_imgdiff.exe "evidence/golden/soundscape.ppm" "tests/golden/soundscape.ppm" 3.0 0.80
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Asset pipeline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence/assets | Out-Null
          & build/tools/${{ matrix.build_type }}/ws_assetgen.exe evidence/assets |
            Tee-Object -FilePath evidence/assets/assetgen.txt
          if (-not (Select-String -Path evidence/assets/assetgen.txt -Pattern "WS_ASSETGEN_OK" -Quiet)) { exit 1 }
          # Regenerating must reproduce byte-identical assets and match the
          # committed provenance record so it cannot silently drift.
          New-Item -ItemType Directory -Force -Path evidence/assets/repeat | Out-Null
          & build/tools/${{ matrix.build_type }}/ws_assetgen.exe evidence/assets/repeat | Out-Null
          foreach ($a in "cube","plane","sphere","checker","noise") {
            foreach ($ext in "wsmesh","wstex") {
              $gen = "evidence/assets/$a.$ext"
              if (Test-Path $gen) {
                if (-not (Test-Path "evidence/assets/repeat/$a.$ext")) { Write-Error "asset $a.$ext missing on repeat"; exit 1 }
                if ((Get-FileHash $gen).Hash -ne (Get-FileHash "evidence/assets/repeat/$a.$ext").Hash) { Write-Error "asset $a.$ext not reproducible"; exit 1 }
                if ((Get-FileHash $gen).Hash -ne (Get-FileHash "assets/primitives/$a.$ext").Hash) { Write-Error "committed asset $a.$ext differs"; exit 1 }
              }
            }
          }

      - name: Application capture
        shell: pwsh
        run: |
          # The user-visible preview app renders the same scenes headless and
          # writes real frame evidence. Its 320x240 output must be byte-identical
          # to the golden harness output from the same run (hash compare: Windows
          # has no cmp), proving the app and harness share one renderer path.
          New-Item -ItemType Directory -Force -Path evidence/app | Out-Null
          & build/src/app/${{ matrix.build_type }}/worldseed.exe --selftest --size 640x360 |
            Tee-Object -FilePath evidence/app/selftest.txt
          if (-not (Select-String -Path evidence/app/selftest.txt -Pattern "APP_SELFTEST_OK" -Quiet)) { exit 1 }
          & build/src/app/${{ matrix.build_type }}/worldseed.exe --list |
            Tee-Object -FilePath evidence/app/scenes.txt
            $scenes = "orbit","lowlight","spheres","materials","textured","sky","shadows","terrain_day","terrain_dusk","terrain_weather","terrain_physics","creature_walk","organism_forage","ecosystem","world_stream","director_shot","soundscape"
          for ($i = 0; $i -lt $scenes.Count; $i++) {
            $s = $scenes[$i]
            & build/src/app/${{ matrix.build_type }}/worldseed.exe --capture "evidence/app/$s.ppm" --scene $i --size 320x240
            if ((Get-FileHash "evidence/app/$s.ppm").Hash -ne (Get-FileHash "evidence/golden/$s.ppm").Hash) {
              Write-Error "app frame $s differs from golden harness"; exit 1
            }
          }

      - name: Soundscape audio evidence
        shell: pwsh
        run: |
          # The P9 soundscape is our own C17 synthesis, not a recorded track.
          # Render a real WAV from a real ecology run, prove it carries signal,
          # and prove it is deterministic (same seed -> same PCM digest).
          New-Item -ItemType Directory -Force -Path evidence/audio | Out-Null
          & build/tools/${{ matrix.build_type }}/ws_audio.exe evidence/audio/soundscape.wav 20260101 |
            Tee-Object -FilePath evidence/audio/audio.txt
          if (-not (Select-String -Path evidence/audio/audio.txt -Pattern "WS_AUDIO_OK" -Quiet)) { exit 1 }
          & build/tools/${{ matrix.build_type }}/ws_audio.exe evidence/audio/repeat.wav 20260101 |
            Tee-Object -FilePath evidence/audio/audio-repeat.txt | Out-Null
          $a = (Select-String -Path evidence/audio/audio.txt -Pattern "sha256=([0-9a-f]+)").Matches[0].Groups[1].Value
          $b = (Select-String -Path evidence/audio/audio-repeat.txt -Pattern "sha256=([0-9a-f]+)").Matches[0].Groups[1].Value
          if ($a -eq "" -or $a -ne $b) { Write-Error "soundscape not reproducible"; exit 1 }

      - name: Live application evidence
        shell: pwsh
        run: |
          # P11: the interactive application. Drive the real headless live loop
          # and the deterministic tour, then prove two tours agree frame-for-frame
          # (the observer is read-only). This runs the same code path as the
          # windowed application, minus the Win32 presentation.
          $exe = "build/src/app/${{ matrix.build_type }}/worldseed.exe"
          New-Item -ItemType Directory -Force -Path evidence/live/tour-a,evidence/live/tour-b | Out-Null
          & $exe --live-headless 2 --size 320x180 | Tee-Object -FilePath evidence/live/headless.txt
          if (-not (Select-String -Path evidence/live/headless.txt -Pattern "LIVE_HEADLESS_OK" -Quiet)) { exit 1 }
          & $exe --live-tour evidence/live/tour-a --size 320x180 | Tee-Object -FilePath evidence/live/tour-a.txt
          if (-not (Select-String -Path evidence/live/tour-a.txt -Pattern "LIVE_TOUR_OK" -Quiet)) { exit 1 }
          if (-not (Select-String -Path evidence/live/tour-a.txt -Pattern "saved=1 loaded=1 roundtrip=1" -Quiet)) { exit 1 }
          if (-not (Select-String -Path evidence/live/tour-a/manifest.txt -Pattern "single_step_verified=1" -Quiet)) { exit 1 }
          if (-not (Select-String -Path evidence/live/tour-a/manifest.txt -Pattern "settings_menu_verified=1" -Quiet)) { exit 1 }
          if (-not (Select-String -Path evidence/live/tour-a/manifest.txt -Pattern "world_select_verified=1" -Quiet)) { exit 1 }
          if (-not (Select-String -Path evidence/live/tour-a/manifest.txt -Pattern "menu_click_verified=1" -Quiet)) { exit 1 }
          if (-not (Select-String -Path evidence/live/tour-a/manifest.txt -Pattern "camera_collision_verified=1" -Quiet)) { exit 1 }
          & $exe --live-tour evidence/live/tour-b --size 320x180 | Out-Null
          Get-ChildItem evidence/live/tour-a/step-*.ppm | ForEach-Object {
            $b = Join-Path "evidence/live/tour-b" $_.Name
            if ((Get-FileHash $_.FullName).Hash -ne (Get-FileHash $b).Hash) {
              Write-Error "live tour $($_.Name) not reproducible"; exit 1
            }
          }
          # World selection (docs/17 "Ana deneyim"): new / sample / load.
          & $exe --live-select evidence/live/select --size 320x180 | Tee-Object -FilePath evidence/live/select.txt
          if (-not (Select-String -Path evidence/live/select.txt -Pattern "LIVE_SELECT_OK" -Quiet)) { exit 1 }
          if (-not (Select-String -Path evidence/live/select/select-manifest.txt -Pattern "can_load=1" -Quiet)) { exit 1 }
          if (-not (Select-String -Path evidence/live/select/select-manifest.txt -Pattern "sample_reproducible=1" -Quiet)) { exit 1 }
          if (-not (Select-String -Path evidence/live/select/select-manifest.txt -Pattern "load_restored=1" -Quiet)) { exit 1 }
          # Replay (P11 item 8): the newest recorded sample reproduces the live
          # digest exactly, and leaving replay restores the live world.
          & $exe --live-replay evidence/live/replay --size 320x180 | Tee-Object -FilePath evidence/live/replay.txt
          if (-not (Select-String -Path evidence/live/replay.txt -Pattern "LIVE_REPLAY_OK" -Quiet)) { exit 1 }
          if (-not (Select-String -Path evidence/live/replay/replay-manifest.txt -Pattern "newest_matches_live=1" -Quiet)) { exit 1 }
          if (-not (Select-String -Path evidence/live/replay/replay-manifest.txt -Pattern "live_restored=1" -Quiet)) { exit 1 }
          # Directional shadows (P12): the on/off pair must differ.
          $diff = & "build/tools/${{ matrix.build_type }}/ws_imgdiff.exe" `
            evidence/live/tour-a/step-08-shadows_off.ppm `
            evidence/live/tour-a/step-09-shadows_on.ppm
          $diff | Out-File -Encoding ascii evidence/live/shadows_diff.txt
          if (-not ($diff | Select-String -Pattern "WS_IMGDIFF_OK" -Quiet)) { exit 1 }
          $nd = [int]([regex]::Match(($diff -join " "), "differing=(\d+)").Groups[1].Value)
          if ($nd -le 0) { Write-Error "shadows changed nothing"; exit 1 }

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-msvc-${{ matrix.build_type }}
          path: evidence/

  plan-integrity:
    name: plan integrity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify plan bundle SHA-256
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, sys
          parts = sorted(Path("docs/plan-bundle").glob("part-*.txt"))
          if len(parts) != 16:
              sys.exit(f"expected 16 parts, found {len(parts)}")
          payload = base64.b64decode("".join(p.read_text(encoding="ascii").strip() for p in parts), validate=True)
          expected = "69c49e5d7868fe1d83c2559f5da703a95eb443d18e4a5bd8b29eaa6c5a8f2f5a"
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              sys.exit(f"plan bundle digest mismatch: {actual}")
          print("plan bundle digest verified:", actual)
          PY

  docs-links:
    name: docs links
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify README doc links resolve
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          text = Path("README.md").read_text(encoding="utf-8")
          missing = [m for m in re.findall(r"`(docs/[A-Za-z0-9._/-]+)`", text) if not Path(m).exists()]
          if missing:
              sys.exit("missing linked docs: " + ", ".join(sorted(set(missing))))
          print("all README doc links resolve")
          PY
